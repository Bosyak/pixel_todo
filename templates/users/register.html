{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-box pixel-panel">
    <h1>Создание героя</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <label>{{ field.label }}: {{ field }}</label>
            {% if field.errors %}<div class="error-msg">{{ field.errors|join:", " }}</div>{% endif %}
        {% endfor %}
        <button type="submit" class="pixel-btn">Начать приключение</button>
    </form>
    <p class="small">Уже есть герой? <a href="{% url 'users:login' %}">Войти</a></p>
</div>
{% endblock %}
