{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-box pixel-panel">
    <h1>Вход в игру</h1>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}<div class="error-msg">Неверный логин или пароль</div>{% endif %}
        <label>Логин: {{ form.username }}</label>
        <label>Пароль: {{ form.password }}</label>
        <button type="submit" class="pixel-btn">Играть</button>
    </form>
    <p class="small">Нет персонажа? <a href="{% url 'users:register' %}">Создать</a></p>
</div>
{% endblock %}
